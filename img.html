<!DOCTYPE html>
<html>
<head>
<title>HTML Image Tag Examples</title>
</head>

<body>

<b>
<h3>Name: Aditya Rathi</h3>
<h3>Roll no: 39</h3>
<h3>Experiment no: 5</h3>
</b>

<h2>1. Basic Image</h2>
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
alt="Sunset over ocean" width="400" height="300">

<h2>2. Image with Width and Height</h2>
<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
alt="Nature Image" width="300" height="200">

<h2>3. Image with Title (Tooltip)</h2>
<img src="https://images.unsplash.com/photo-1517849845537-4d257902454a"
alt="Dog Image" title="Cute Dog" width="200">

<h2>4. Image with Border (CSS)</h2>
<img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
alt="Border Image" style="border:3px solid black;" width="200">

<h2>5. Image as a Link</h2>
<a href="https://unsplash.com/s/photos/tropical-sunset" target="_blank">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
alt="Clickable Sunset" width="200">
</a>

<h2>6. Responsive Image</h2>
<img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429"
alt="Responsive Landscape" style="max-width:100%; height:auto;">

<h2>7. Image Alignment</h2>
<img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d"
alt="Right Aligned Sun" style="float:right;" width="200" height="150">
<p>This text wraps around the image.</p>

<br><br><br>

<h2>8. Image with Caption (Figure Tag)</h2>
<figure>
<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" width="300">
<figcaption>This is a nature image caption.</figcaption>
</figure>

</body>
</html>
